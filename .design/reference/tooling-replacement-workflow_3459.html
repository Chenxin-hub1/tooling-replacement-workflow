<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooling Replacement Workflow</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#16202B; --steel:#3E4C5B; --mist:#7A8794; --line:#D7DDE3; --panel:#F3F5F7; --paper:#FFFFFF;
  --blue:#1F4E8C; --blue-soft:#E4ECF7;
  --g:#1E8E5A; --g-soft:#DFF3E8; --y:#C98A00; --y-soft:#FFF1CC; --r:#C8362B; --r-soft:#FBE1DE; --gr:#A7B0B8; --gr-soft:#EDF0F2;
  --radius:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--panel);line-height:1.45}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--blue)}

/* shell */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#C9D2DB;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.rail .brand{color:#fff;font-weight:600;font-size:15px;letter-spacing:.01em;margin-bottom:4px}
.rail .brand small{display:block;font-weight:400;color:#8A97A4;font-size:12px;margin-top:2px}
.rail .who{margin:14px 0 18px;background:#22303D;border-radius:var(--radius);padding:8px 10px;font-size:12px;color:#B9C4CF}
.rail .who input,.rail .who select{width:100%;margin-top:4px;background:#16202B;color:#fff;border:1px solid #3B4B5B;border-radius:4px;padding:5px 6px;font-size:13px}
.rail .who select option{background:#16202B;color:#fff}
.nav{background:none;border:0;color:#C9D2DB;text-align:left;padding:9px 10px;border-radius:var(--radius);display:flex;justify-content:space-between;align-items:center;font-size:14px}
.nav:hover{background:#22303D}
.nav.active{background:var(--blue);color:#fff}
.nav .pill{font-size:11px;background:#33414F;color:#fff;border-radius:10px;padding:1px 7px;font-weight:600}
.nav.active .pill{background:rgba(255,255,255,.22)}
.rail .spacer{flex:1}
.rail .foot{font-size:11px;color:#6E7B88;line-height:1.5}
.btn-new{background:#fff;color:var(--ink);border:0;padding:10px;border-radius:var(--radius);font-weight:600;margin-top:6px}
.btn-new:hover{background:#E9EEF3}

main{padding:26px 32px 60px;min-width:0}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;margin-bottom:10px}
.sub{color:var(--mist);font-size:13px;margin-top:2px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:6px 8px;font-size:13px;min-width:120px}
.filters .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:13px}
.filters .chip.on{background:var(--r-soft);border-color:var(--r);color:var(--r);font-weight:600}
.filters .clear{background:none;border:0;color:var(--mist);text-decoration:underline;font-size:12px}

/* cards & tables */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.grid{display:grid;gap:14px}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.kpi{display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--line)}
.kpi b{font-size:28px;font-weight:600;line-height:1.1}
.kpi span{color:var(--steel);font-size:13px}
.kpi.g{border-left-color:var(--g)} .kpi.y{border-left-color:var(--y)} .kpi.r{border-left-color:var(--r)} .kpi.b{border-left-color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--steel);border-bottom:1px solid var(--line);padding:8px 10px;font-size:12px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #EEF1F4;vertical-align:middle}
tr.row:hover td{background:#F8FAFC;cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--mist)}
.bold{font-weight:600}

/* status */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.st{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.st.green{background:var(--g-soft);color:var(--g)} .st.yellow{background:var(--y-soft);color:var(--y)} .st.red{background:var(--r-soft);color:var(--r)} .st.gray{background:var(--gr-soft);color:var(--steel)}
.dot.green{background:var(--g)} .dot.yellow{background:var(--y)} .dot.red{background:var(--r)} .dot.gray{background:var(--gr)}

/* phase rail: signature element */
.rail6{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;width:160px}
.leadin{width:52px;border:1px solid var(--line);border-radius:4px;padding:3px 5px;text-align:right;font-size:12px}
.adj{color:var(--blue);font-weight:600}
.rail6 i{height:8px;border-radius:2px;background:var(--gr-soft);display:block;position:relative}
.rail6 i.green{background:var(--g)} .rail6 i.yellow{background:var(--y)} .rail6 i.red{background:var(--r)}
.rail6 i.current::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:2px;background:var(--ink);border-radius:1px}
.pct{display:inline-flex;align-items:center;gap:8px}
.bar{width:70px;height:6px;background:var(--gr-soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}

/* project view */
.phasehead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin:16px 0 6px;font-weight:600}
.phasehead .meta{font-weight:400;color:var(--steel);font-size:12px;display:flex;gap:14px}
.masters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 18px;font-size:13px}
.masters div span{display:block;color:var(--mist);font-size:12px}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:13px}
.team div{border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px}
.team div span{display:block;color:var(--mist);font-size:12px}
.flags{list-style:none}
.flags li{padding:6px 0;border-bottom:1px solid #EEF1F4;display:flex;gap:8px;align-items:center}
.timeline{position:relative;height:56px;margin:8px 0 4px}
.timeline .track{position:absolute;top:26px;left:0;right:0;height:4px;background:var(--gr-soft);border-radius:2px}
.timeline .today{position:absolute;top:14px;width:2px;height:28px;background:var(--ink)}
.timeline .today span{position:absolute;top:-16px;left:-14px;font-size:11px;color:var(--ink);font-weight:600}
.timeline .ms{position:absolute;top:21px;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.timeline .ms span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--steel);white-space:nowrap}

/* actions */
.link{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0}
.btn{background:var(--blue);color:#fff;border:0;padding:7px 14px;border-radius:var(--radius);font-weight:600;font-size:13px}
.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:12px}

/* modal / wizard */
.overlay{position:fixed;inset:0;background:rgba(22,32,43,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:8px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:22px 24px}
.modal h2{font-size:17px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;color:var(--steel);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:var(--radius);padding:8px 9px;font-size:13px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.steps{display:flex;gap:6px;margin:6px 0 18px}
.steps span{flex:1;height:4px;background:var(--gr-soft);border-radius:2px}
.steps span.done{background:var(--blue)}
.mfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
.req{color:var(--r)}
.note{background:var(--blue-soft);border-radius:var(--radius);padding:10px 12px;font-size:13px;color:var(--steel);margin-bottom:12px}
.hint{font-size:12px;color:var(--mist)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--radius);font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}

/* mgmt */
.hbar{display:grid;grid-template-columns:150px 1fr 36px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .b{height:14px;background:var(--r);border-radius:2px}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.mail{border-left:3px solid var(--line);padding:8px 12px;margin-bottom:8px;font-size:13px;background:#fff}
.mail.esc{border-left-color:var(--r)} .mail.due{border-left-color:var(--y)} .mail.assign{border-left-color:var(--blue)}
.mail .to{color:var(--mist);font-size:12px}
.rule{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #EEF1F4;font-size:13px}
.rule input{width:80px;border:1px solid var(--line);border-radius:4px;padding:5px 7px;text-align:right}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;padding:8px 14px;color:var(--steel);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--mist)}
.lt{display:flex;align-items:center;gap:12px}
.lt input[type=range]{flex:1}
.lt b{font-size:22px;min-width:90px}
@media (max-width:900px){.shell{grid-template-columns:1fr}.rail{position:static;height:auto}.grid.c4,.grid.c3,.grid.c2,.masters,.team{grid-template-columns:1fr 1fr}main{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">Tooling Replacement Workflow</div>
    <div class="who">Signed in as<select id="userSel" onchange="me=this.value;render()"></select></div>
    <button class="nav" data-v="portfolio">Portfolio</button>
    <button class="nav" data-v="mine">My actions <span class="pill" id="pillMine">0</span></button>
    <button class="nav" data-v="mgmt">Management</button>
    <button class="nav" data-v="settings">Reminders · Email / Teams <span class="pill" id="pillMail">0</span></button>
    <button class="nav" data-v="admin">Admin · People &amp; functions</button>
    <button class="btn-new" onclick="openWizard()">+ New project</button>
    <div class="spacer"></div>
    <div class="foot"><span id="saveLbl"></span><br>Today: <b id="todayLbl"></b><br>Prototype — six phases, owners, tabs, actions and default lead times from the process sheets. Items can be added per step.</div>
  </aside>
  <main id="main"></main>
</div>

<div class="overlay" id="wiz"><div class="modal" id="wizBody"></div></div>
<div class="overlay" id="act"><div class="modal" id="actBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- constants ---------- */
const TODAY = new Date('2026-09-12');
const PHASES = ['1. Tool Creation','2. Development','3. Internal Approval','4. Customer Approval','5. Scrap','6. Archive'];
const INIT_FIELDS=[['pn','Part Number'],['desc','Part Description'],['plant','Plant affected'],['reason','Reason'],['cur','Current Supplier'],['nw','New Supplier'],['po','Tool PO'],['tag','Tool Tag'],['tooOwner','Tool Owner'],['cav','Cavities'],['oem','OEM'],['tech','Tech'],['saving','Estimated saving (€/yr)']];
let FUNCTIONS = ['BU Buyer','SDE','PM','ENG','SP/BU','Accounting'];
const INITIATOR_FN='BU Buyer';
let ADMINS=['Carrie Chen']; const isAdmin=n=>ADMINS.includes(n);
let TEAM_ROWS=[['SDE','SDE'],['PM','PM'],['ENG','Engineer'],['SP/BU','Tactical/BU'],['Accounting','Accounting']];
let REQUIRED_TEAM = ['SDE','PM','ENG','SP/BU'];

/* Standard process template — 1:1 from the process Excel (Owner / Tab / Action / Due date since creation / Phase).
   Phase 1 rows are the Initiator inputs (master data + team) and close on creation.
   lead = default lead time in days counted from the predecessor (dep = index of the action it follows; null = project creation).
   lead:null = sheet shows '-', '?' or blank → no default; authorized user must enter a lead time. */
const MATRIX = [
 {ph:1,tab:'CR',act:'Input CR number',input:'CR number',fn:'SDE',lead:7,dep:null},
 {ph:1,tab:'PPAP ID',act:'Input PPAP ID number',input:'PPAP ID',fn:'BU Buyer',lead:7,dep:null},
 {ph:1,tab:'FOT Date',act:"Input Supplier's target date for FOT",input:'Date',fn:'SDE',lead:7,dep:null},
 {ph:1,tab:'PPAP Sample Date',act:"Input Supplier's target date for Samples",input:'Date',fn:'SDE',lead:7,dep:null},
 {ph:1,tab:'PPAP Submission Date',act:"Input Supplier's target date for PPAP submission",input:'Date',fn:'SDE',lead:7,dep:null},
 {ph:1,tab:'Current Coverage',act:'Input date of coverage on current supplier',input:'Date',fn:'BU Buyer',lead:7,dep:null},
 {ph:1,tab:'BPO',act:'Input BPO number',input:'BPO number',fn:'SP/BU',lead:30,dep:null},
 {ph:1,tab:'Change',act:'Identify if External or Internal',input:'External / Internal',fn:'PM',lead:7,dep:null},
 {ph:1,tab:'SOP',act:'Input date needed by ZF to implement',input:'Date',fn:'BU Buyer',lead:7,dep:null},
 {ph:2,tab:'CVS CR',act:'Identify if applicable or not',input:'Applicable / Not applicable',fn:'ENG',lead:null,dep:null},
 {ph:2,tab:'CVS CR',act:'Input CR number for CVS on Windchill',input:'CR number',fn:'ENG',lead:null,dep:9},
 {ph:2,tab:'PPAP Status',act:'Input if Draft, Interim approved, or Full approved',input:'Draft / Interim approved / Full approved',fn:'SDE',lead:null,dep:4},
 {ph:2,tab:'Pre Grain',act:'Identify if applicable or not',input:'Applicable / Not applicable',fn:'SDE',lead:null,dep:null},
 {ph:2,tab:'Pre Grain',act:'Input pre-grain target date approval',input:'Date',fn:'SDE',lead:null,dep:12},
 {ph:2,tab:'Core BPW',act:'Input BPW number',input:'BPW number',fn:'PM',lead:175,dep:null},
 {ph:2,tab:'Core BPW',act:'Input target date for approval',input:'Date',fn:'PM',lead:null,dep:14},
 {ph:3,tab:'AAR',act:'Identify if applicable or not',input:'Applicable / Not applicable',fn:'SDE',lead:null,dep:null},
 {ph:3,tab:'AAR',act:'Input target date for approval',input:'Date',fn:'SDE',lead:null,dep:16},
 {ph:3,tab:'OEM BPW',act:'Identify BPW number',input:'BPW number',fn:'PM',lead:null,dep:null},
 {ph:3,tab:'OEM BPW',act:'Input target date for approval',input:'Date',fn:'PM',lead:175,dep:null},
 /* 5. Scrap — from the second sheet extract ("Tactical" = Tactical/BU = SP/BU). No lead times given yet. */
 {ph:4,tab:'Old tool disposition',act:'Confirm scrap / return / storage / disposition if required',input:'Scrap / Return / Storage / Not required',fn:'SP/BU',lead:null,dep:null,comment:''},
 {ph:4,tab:'Receive SCR request',act:'Request SCR from supplier to proceed with scrapping tool',input:'SCR reference',fn:'SDE',lead:null,dep:20,comment:''},
 {ph:4,tab:'Prepare documentation for scrapping',act:'Review if tool can be scrapped and fill TDA format',input:'TDA document link',fn:'SP/BU',lead:null,dep:21,comment:''},
 {ph:4,tab:'TDA Approval',act:'Review tool in the books / approval',input:'Approval date',fn:'Accounting',lead:null,dep:22,comment:''},
 {ph:4,tab:'Scrap tool',act:'Confirm if internal scrapping or external scrap',input:'Internal / External',fn:'Accounting',lead:null,dep:23,comment:''},
 /* 6. Archive (Doc. Storage) */
 {ph:5,tab:'Prepare management review',act:'Prepare slides / summary / overdue list',input:'Review document link',fn:'SP/BU',lead:null,dep:null,comment:''},
 {ph:5,tab:'Attend supplier status meeting',act:'Review multiple tooling projects with supplier',input:'Meeting date',fn:'SP/BU',lead:null,dep:null,comment:''},
 {ph:5,tab:'Maintain tooling master list',act:'Update master list / Excel / SharePoint / system',input:'Update date',fn:'SP/BU',lead:null,dep:null,comment:''},
 {ph:5,tab:'Upload / store documents',act:'Save RFQ / quote / PO / PPAP / approvals in required location',input:'Folder link',fn:'SP/BU',lead:null,dep:null,comment:''},
 {ph:5,tab:'Search for historical information',act:'Search old emails / folders / systems for previous tooling data',input:'Findings / link',fn:'SP/BU',lead:null,dep:null,comment:''},
 {ph:5,tab:'Correct data / tracker errors',act:'Correct tool status / ownership / timing / supplier information',input:'Correction date',fn:'SP/BU',lead:null,dep:null,comment:''},
];
let CUSTOM_SEQ=0;
let MANUAL=[]; // manual reminders sent in this session {ts,by,to,cc,a,p,note}

const PEOPLE = {
 'BU Buyer':['Carrie Chen','Marta Kowalski','Rahul Iyer'],
 'SDE':['Daniel Wu','Ines Bauer'],
 'PM':['Sofia Rossi','Tom Becker'],
 'ENG':['Ken Tanaka','Priya Nair'],
 'SP/BU':['Luis Ortega'],
 'Accounting':['Julia Lang','Wei Zhang'],
};
const EMAILS={};
const email = n => n?(EMAILS[n]||n.toLowerCase().replace(/ /g,'.')+'@zf-lifetec.com'):'';
let RULES = {before:5, overdueEvery:2, escalateAfter:5, channel:'both'};
const CH={email:'✉ Email',teams:'💬 Teams',both:'✉ Email + 💬 Teams'};

/* ---------- helpers ---------- */
const d2s = d => d.toISOString().slice(0,10);
const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const days = (a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const fmt = s => s?new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'';

function buildActions(p){
  return MATRIX.map((m,i)=>({
    id:p.id+'-'+i, ph:m.ph, tab:m.tab, act:m.act, input:m.input, fn:m.fn, dep:m.dep===null?null:p.id+'-'+m.dep,
    leadDefault:m.lead, lead:m.lead, owner:p.team[m.fn]||'',
    due:'', done:null, value:'', comment:m.comment||'', link:''
  }));
}
/* Dependency-driven schedule: due = (predecessor actual completion or due, else project creation) + lead */
const byId=(p,id)=>p.actions.find(x=>x.id===id);
function baseDate(p,a){ if(a.dep===null) return d2s(p.created); const d=byId(p,a.dep); return d?(d.done||d.due||''):d2s(p.created); }
function schedule(p){
  for(let pass=0;pass<2;pass++) p.actions.forEach(a=>{ const base=baseDate(p,a); a.due=(a.lead===null||!base)?'':d2s(addDays(base,a.lead)); });
}
function aStatus(a){
  if(a.done) return 'green';
  if(!a.due) return 'gray';
  const dl=days(TODAY,a.due);
  if(dl<0) return 'red';
  if(dl<=RULES.before) return 'yellow';
  return 'gray';
}
const STL={green:'Complete',yellow:'Due soon',red:'Overdue',gray:'Not started'};
const PSL={green:'Complete',yellow:'At risk',red:'Overdue',gray:'On track'};
const stLabel=a=>a.done?'Complete':!a.due?'No due date':STL[aStatus(a)];
function summary(p){
  const s={green:0,yellow:0,red:0,gray:0};
  p.actions.forEach(a=>s[aStatus(a)]++);
  const total=p.actions.length, pct=Math.round(100*s.green/total);
  const open=p.actions.filter(a=>!a.done);
  let phase=5; for(let i=0;i<6;i++){ if(p.actions.some(a=>a.ph===i&&!a.done)){phase=i;break;} }
  const next=open.filter(a=>a.due).sort((a,b)=>a.due<b.due?-1:1)[0];
  const overall = s.red>0?'red':(s.yellow>0?'yellow':(pct===100?'green':'gray'));
  const dues=p.actions.map(a=>a.done||a.due).filter(Boolean).sort();
  const target=dues.length?dues[dues.length-1]:d2s(p.created);
  const leadTotal=days(d2s(p.created),target);
  const undated=p.actions.filter(a=>!a.done&&!a.due).length;
  const adjusted=p.actions.filter(a=>a.lead!==a.leadDefault).length;
  return {...s,total,pct,phase,next,overall,open:open.length,target,leadTotal,undated,adjusted};
}
function phaseStatus(p,i){
  const acts=p.actions.filter(a=>a.ph===i);
  if(!acts.length) return i===0?'green':'gray';
  if(acts.every(a=>a.done)) return 'green';
  if(acts.some(a=>aStatus(a)==='red')) return 'red';
  if(acts.some(a=>aStatus(a)==='yellow')) return 'yellow';
  return 'gray';
}
const stTag=(s,lbl)=>`<span class="st ${s}"><i class="dot ${s}" style="margin:0"></i>${lbl||STL[s]}</span>`;
const railHtml=(p,cur)=>`<div class="rail6" title="${PHASES.map((n,i)=>n+': '+PSL[phaseStatus(p,i)]).join(' | ')}">${PHASES.map((_,i)=>`<i class="${phaseStatus(p,i)} ${i===cur?'current':''}"></i>`).join('')}</div>`;

/* ---------- seed data ---------- */
let projects=[];

let DL_SEQ=0;
function enhanceSelects(root){
  root.querySelectorAll('select:not([data-plain]):not([data-enhanced])').forEach(sel=>{
    if(sel.options.length<=3) return;
    sel.dataset.enhanced='1'; const id='dl'+(++DL_SEQ);
    const inp=document.createElement('input'); inp.setAttribute('list',id); inp.className=sel.className; inp.style.cssText=sel.style.cssText||'border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;font-size:13px;min-width:120px';
    const cur=sel.options[sel.selectedIndex]; inp.value=(cur&&cur.value!=='')?cur.textContent:''; inp.placeholder=(sel.options[0]&&sel.options[0].value==='')?sel.options[0].textContent:'Type to search…';
    const dl=document.createElement('datalist'); dl.id=id; [...sel.options].forEach(o=>{if(o.value==='')return;const x=document.createElement('option');x.value=o.textContent;dl.appendChild(x)});
    const apply=()=>{const m=[...sel.options].find(o=>o.textContent===inp.value)||(inp.value===''?sel.options[0]:null); if(!m){inp.style.borderColor='var(--r)';return;} inp.style.borderColor=''; if(sel.value!==m.value){sel.value=m.value;sel.dispatchEvent(new Event('change'));}};
    inp.addEventListener('change',apply); inp.addEventListener('focus',()=>{inp.dataset.prev=inp.value;inp.value='';}); inp.addEventListener('blur',()=>{if(inp.value==='')inp.value=inp.dataset.prev||'';});
    sel.style.display='none'; sel.after(inp); inp.after(dl);
  });
}

}

   <button class="chip ${F.overdue?'on':''}" onclick="F.overdue=!F.overdue;render()">Overdue only</button>
   <button class="clear" onclick="F={q:'',owner:'',bu:'',plant:'',supplier:'',fn:'',member:'',phase:'',status:'',from:'',to:'',overdue:false};render()">Clear</button>
  </div>`;
}
function filteredProjects(){
  return projects.filter(p=>{
    const s=summary(p);
    if(F.q && !(p.id+p.pn+p.desc).toLowerCase().includes(F.q.toLowerCase())) return false;
    if(F.owner && p.owner!==F.owner) return false;
    if(F.bu && p.bu!==F.bu) return false;
    if(F.plant && p.plant!==F.plant) return false;
    if(F.supplier && p.cur!==F.supplier && p.nw!==F.supplier) return false;
    if(F.phase!=='' && s.phase!==Number(F.phase)) return false;
    if(F.status && s.overall!==F.status) return false;
    if(F.member && !Object.values(p.team).includes(F.member)) return false;
    if(F.fn && !p.actions.some(a=>a.fn===F.fn&&!a.done)) return false;
    if(F.overdue && s.red===0) return false;
    return true;
  });
}
function actionPass(a){
  if(F.fn && a.fn!==F.fn) return false;
  if(F.member && a.owner!==F.member) return false;
  if(F.from && a.due<F.from) return false;
  if(F.to && a.due>F.to) return false;
  if(F.overdue && aStatus(a)!=='red') return false;
  if(F.status && aStatus(a)!==F.status) return false;
  if(F.phase!=='' && a.ph!==Number(F.phase)) return false;
  return true;
}

/* Reminder engine: what the daily job would send on a given date */
function remindersOn(date){
  const mails=[];
  projects.forEach(p=>p.actions.forEach(a=>{
    if(a.done||!a.due) return; const dl=days(date,a.due);
    if(dl===RULES.before) mails.push({k:'due',to:a.owner,cc:'',a,p,s:`Reminder: ${a.tab} · ${a.act} is due in ${RULES.before} days (${p.id})`});
    else if(dl===0) mails.push({k:'due',to:a.owner,cc:'',a,p,s:`Due today: ${a.tab} · ${a.act} (${p.id})`});
    else if(dl<0 && (-dl)%RULES.overdueEvery===0){const esc=-dl>=RULES.escalateAfter;mails.push({k:esc?'esc':'due',to:a.owner,cc:esc?p.owner:'',a,p,s:`${esc?'ESCALATION':'Overdue'}: ${a.tab} · ${a.act} is ${-dl} days late (${p.id})`});}
  }));
  return mails;
}
function nextReminder(a){
  if(a.done||!a.due) return '';
  const dl=days(TODAY,a.due);
  if(dl>RULES.before) return `${fmt(d2s(addDays(a.due,-RULES.before)))} (${RULES.before} d before due)`;
  if(dl>0) return `${fmt(a.due)} (on due date)`;
  const n=RULES.overdueEvery-((-dl)%RULES.overdueEvery); const d=d2s(addDays(TODAY,n===RULES.overdueEvery?0:n));
  return `${fmt(d)} (overdue, every ${RULES.overdueEvery} d${-dl+ (n===RULES.overdueEvery?0:n)>=RULES.escalateAfter?', cc project owner':''})`;
}

function renameFunction(i,nv){

  FUNCTIONS[i]=nv; PEOPLE[nv]=PEOPLE[old]||[]; delete PEOPLE[old];

  const ri=REQUIRED_TEAM.indexOf(old); if(ri>=0) REQUIRED_TEAM[ri]=nv;
  MATRIX.forEach(m=>{if(m.fn===old)m.fn=nv});
  projects.forEach(p=>{if(old in p.team){p.team[nv]=p.team[old];delete p.team[old];} p.actions.forEach(a=>{if(a.fn===old)a.fn=nv});});

function setFnLabel(f,l){const t=TEAM_ROWS.find(t=>t[0]===f); l=l.trim()||f; if(t)t[1]=l; else TEAM_ROWS.push([f,l]); render(); toast(`Team-setup label for ${f}: ${l}`)}

function downloadTemplate(){

const norm=k=>String(k||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const ALIASES={pn:['partnumber','partno','pn'],desc:['partdescription','description'],plant:['plantaffected','plant','affectedplant'],reason:['reason','reasonfortheproject'],cur:['currentsupplier','oldsupplier'],nw:['newsupplier'],po:['toolpo','po'],tag:['tooltag','tag'],tooOwner:['toolowner'],cav:['cavities','numberofcavities','cavity'],saving:['estimatedsavingyr','estimatedsaving','saving','savings'],oem:['oem','customer'],tech:['tech','technology'],id:['project','projectid','projectno'],bu:['bu','businessunit'],created:['created','creationdate','projectcreationdate','startdate']};
function parseDate(v){ if(!v&&v!==0) return null; if(v instanceof Date) return isNaN(v)?null:v; if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*86400000));return d;} const d=new Date(String(v)); return isNaN(d)?null:d; }
function importExcel(file){
  if(!file) return; const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''}); if(!rows.length){toast('No rows found in the first sheet');return;}
      let created=0,updated=0,vals=0;
      rows.forEach(r=>{
        const g=(aliases)=>{const k=Object.keys(r).find(k=>aliases.includes(norm(k)));return k===undefined?'':r[k];};
        const f={}; Object.entries(ALIASES).forEach(([k,al])=>f[k]=g(al));
        if(!f.pn&&!f.desc&&!f.id) return;
        const cr=parseDate(f.created)||TODAY; let id=String(f.id||'').trim()||('TR-'+cr.getFullYear()+'-0'+(30+projects.length+created));
        let p=projects.find(x=>x.id===id); const isNew=!p;
        if(isNew){p={id,team:{},owner:me,created:cr,tooOwner:''};projects.unshift(p);created++;}else updated++;
        Object.assign(p,{pn:String(f.pn||p.pn||''),desc:String(f.desc||p.desc||''),plant:String(f.plant||p.plant||''),reason:String(f.reason||p.reason||''),cur:String(f.cur||p.cur||''),nw:String(f.nw||p.nw||''),po:String(f.po||p.po||''),tag:String(f.tag||p.tag||''),tooOwner:String(f.tooOwner||p.tooOwner||''),cav:String(f.cav||p.cav||''),saving:String(f.saving||p.saving||''),oem:String(f.oem||p.oem||''),tech:String(f.tech||p.tech||''),bu:String(f.bu||p.bu||'')});
        // team: by label ("SDE", "Engineer", "Tactical/BU", ...) or function name; initiator
        p.team[INITIATOR_FN]=String(g(['initiator','bubuyer','buyer'])||p.team[INITIATOR_FN]||me);
        TEAM_ROWS.forEach(([fn,l])=>{const v=g([norm(l),norm(fn)]); if(v) p.team[fn]=String(v);});
        if(isNew){p.actions=buildActions(p);schedule(p);p.owner=p.team[INITIATOR_FN];}
        else p.actions.forEach(a=>{if(!a.custom&&!a.owner)a.owner=p.team[a.fn]||'';});
        // action values: header = Tab or "Tab – input"
        p.actions.forEach(a=>{const v=g([norm(colName(a,p.actions)),norm(a.tab)]); if(v!==''&&v!==null&&v!==undefined){const d=parseDate(v); a.value=(/date/i.test(a.input)&&d)?d2s(d):String(v); if(!a.done){a.done=d2s(TODAY);} vals++;}});
        schedule(p);
      });
      render(); toast(`Imported: ${created} new, ${updated} updated, ${vals} action values filled`);
    }catch(err){console.error(err);toast('Could not read the file — check it is an .xlsx with headers in row 1');}
  };
  rd.readAsArrayBuffer(file);
}

/* ---------- Excel export (SheetJS) ---------- */
const cellStatus=a=>a.done?`Done ${fmt(a.done)}`:!a.due?'No due date':aStatus(a)==='red'?`OVERDUE ${-days(TODAY,a.due)} d (due ${fmt(a.due)})`:`Due ${fmt(a.due)}`;
/* Flat row: master data → team → every action's entered value, in template order (header = Tab, or Tab – input when a tab has several rows) */
function colName(a,all){const same=all.filter(x=>x.tab===a.tab);return same.length>1?`${a.tab} – ${a.input}`:a.tab;}
function flatRow(p){
  const r={'Part Number':p.pn,'Part Description':p.desc,'Plant affected':p.plant,'Reason':p.reason,'Current Supplier':p.cur,'New Supplier':p.nw,'Tool PO':p.po,'Tool Tag':p.tag,'Tool Owner':p.tooOwner,'Cavities':p.cav,'OEM':p.oem||'','Tech':p.tech||'','Estimated saving (€/yr)':p.saving||'','Project':p.id,'BU':p.bu,'Created':fmt(d2s(p.created)),'Initiator':p.team['BU Buyer']||''};
  TEAM_ROWS.forEach(([f,l])=>{r[l]=p.team[f]||'';});
  p.actions.forEach(a=>{r[colName(a,p.actions)]=a.value||'';});
  return r;
}
function projectRow(p){
  const s=summary(p);
  const r={'Project':p.id,'Part Number':p.pn,'Part Description':p.desc,'Plant':p.plant,'BU':p.bu,'Reason':p.reason,'Current Supplier':p.cur,'New Supplier':p.nw,'Tool PO':p.po,'Tool Tag':p.tag,'Tool Owner':p.tooOwner,'Cavities':p.cav,'Created':fmt(d2s(p.created)),'Project owner':p.owner};
  TEAM_ROWS.forEach(([f,l])=>{r['Team: '+l]=p.team[f]||'';});
  Object.assign(r,{'Current phase':PHASES[s.phase],'Overall status':PSL[s.overall],'Completion %':s.pct,'Total actions':s.total,'Completed':s.green,'Open':s.open,'Overdue':s.red,'Due soon':s.yellow,'Without due date':s.undated,'Timings adjusted':s.adjusted,'Overall lead time (d)':s.leadTotal,'Projected completion':fmt(s.target),'Next milestone':s.next?`${s.next.tab} · ${fmt(s.next.due)}`:'','Red flags':p.actions.filter(a=>aStatus(a)==='red').map(a=>`${a.tab} (${a.owner}, ${-days(TODAY,a.due)} d)`).join('; ')});
  p.actions.forEach(a=>{r[`${PHASES[a.ph].slice(0,2)} ${a.tab}${a.custom?' (added)':''}`]=`${cellStatus(a)} · ${a.owner}${a.value?' · '+a.value:''}`;});
  return r;
}
function actionRow(p,a){const s=summary(p);return {'Project':p.id,'Part Description':p.desc,'Plant':p.plant,'BU':p.bu,'Phase':PHASES[a.ph],'Tab':a.tab,'Action':a.act,'Required input':a.input,'Entered value':a.value,'Function':a.fn,'Owner':a.owner,'Owner email':email(a.owner),'Counted from':a.dep?(byId(p,a.dep)||{}).tab||'':'Project creation','Default lead (d)':a.leadDefault??'','Adjusted lead (d)':a.lead??'','Due date':a.due?fmt(a.due):'','Completed':a.done?fmt(a.done):'','Status':stLabel(a),'Days remaining / overdue':a.done||!a.due?'':days(TODAY,a.due),'Comment':a.comment||'','Link':a.link||'','Added to project':a.custom?'Yes':'','Last manual reminder':a.lastRemind?fmt(a.lastRemind):''}}
function sheet(rows){const keys=[];rows.forEach(r=>Object.keys(r).forEach(k=>{if(!keys.includes(k))keys.push(k)}));rows=rows.map(r=>{const o={};keys.forEach(k=>o[k]=r[k]??'');return o});const ws=XLSX.utils.json_to_sheet(rows,{header:keys});ws['!cols']=keys.map(k=>({wch:Math.min(45,Math.max(k.length+2,...rows.map(r=>String(r[k]??'').length+2)))}));ws['!autofilter']={ref:ws['!ref']};return ws;}
function exportPortfolio(){

  XLSX.utils.book_append_sheet(wb,sheet(list.map(flatRow)),'Portfolio');

  XLSX.utils.book_append_sheet(wb,sheet(list.flatMap(p=>p.actions.map(a=>actionRow(p,a)))),'Actions');
  XLSX.utils.book_append_sheet(wb,sheet(list.flatMap(p=>TEAM_ROWS.map(([f,l])=>({'Project':p.id,'Function':l,'Name':p.team[f]||'','Email':email(p.team[f])})))),'Teams');

/* ---------- persistence ---------- */
const STORE_KEY='trw-workspace-v1';
function snapshot(){return {v:1,savedAt:new Date().toISOString(),projects:projects.map(p=>({...p,created:d2s(p.created)})),PEOPLE,EMAILS,ADMINS,FUNCTIONS,TEAM_ROWS,REQUIRED_TEAM,MATRIX,RULES,CUSTOM_SEQ};}
function restore(d){
  projects=d.projects.map(p=>({...p,created:new Date(p.created)})); Object.keys(PEOPLE).forEach(k=>delete PEOPLE[k]); Object.assign(PEOPLE,d.PEOPLE); Object.assign(EMAILS,d.EMAILS||{});
  ADMINS=d.ADMINS||ADMINS; FUNCTIONS=d.FUNCTIONS||FUNCTIONS; TEAM_ROWS=d.TEAM_ROWS||TEAM_ROWS; REQUIRED_TEAM=d.REQUIRED_TEAM||REQUIRED_TEAM; MATRIX.length=0; (d.MATRIX||[]).forEach(m=>MATRIX.push(m)); RULES=d.RULES||RULES; CUSTOM_SEQ=d.CUSTOM_SEQ||0;
  projects.forEach(schedule); LAST_SAVED=d.savedAt||null;
}
let LAST_SAVED=null, STORAGE_OK=true;
function autosave(){ try{ const snap=snapshot(); localStorage.setItem(STORE_KEY,JSON.stringify(snap)); LAST_SAVED=snap.savedAt; STORAGE_OK=true; }catch(e){ STORAGE_OK=false; } const el=document.getElementById('saveLbl'); if(el) el.textContent=STORAGE_OK?`Autosaved in this browser ${new Date(LAST_SAVED).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`:'Not autosaved here — use Save workspace file (Admin)'; }
function loadAutosave(){ try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ restore(JSON.parse(raw)); return true; } }catch(e){} return false; }
function saveWorkspaceFile(){ const snap=snapshot(); const blob=new Blob([JSON.stringify(snap,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Tooling_Workflow_workspace_${d2s(TODAY)}.json`; a.click(); toast('Workspace file downloaded — load it on any device from Admin'); }
function loadWorkspaceFile(file){ if(!file) return; const rd=new FileReader(); rd.onload=e=>{ try{ restore(JSON.parse(e.target.result)); refreshUsers(); render(); toast(`Workspace loaded · ${projects.length} projects`);}catch(err){toast('Could not read that workspace file');} }; rd.readAsText(file); }
function resetDemo(){ if(!confirm('Replace everything with the demo data? Your projects, people and settings in this browser will be lost.')) return; try{localStorage.removeItem(STORE_KEY);}catch(e){} location.reload(); }

/* ---------- misc ---------- */
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),3200)}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
refreshUsers();
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open')}));
render();
</script>
</body>
</html>
